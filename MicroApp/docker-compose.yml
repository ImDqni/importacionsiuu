services:
  inventario:
    build: .
    container_name: gestor-importaciones
    ports:
      - "8501:8501"
    environment:
      - DB_PATH=/app/data/inventario.db
      - STREAMLIT_THEME_PRIMARY_COLOR=#1f9d8f
    volumes:
      # La base de datos SQLite persiste en ./data aunque se apague el contenedor
      - ./data:/app/data
    restart: unless-stopped
